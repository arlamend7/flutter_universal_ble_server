name: universal_ble_server
description: BLE clients and servers with typed fields, framed messages and optional sessions. Native platform APIs, Web Bluetooth clients and Linux multi-device support.
version: 0.2.0
repository: https://github.com/arlamend7/flutter_universal_ble_server
issue_tracker: https://github.com/arlamend7/flutter_universal_ble_server/issues
topics:
  - bluetooth
  - ble
  - communication
  - gatt

environment:
  sdk: ^3.8.1
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.universal_ble_server
        pluginClass: UniversalBleServerPlugin
      ios:
        pluginClass: UniversalBleServerPlugin
      macos:
        pluginClass: UniversalBleServerPlugin
      windows:
        pluginClass: UniversalBleServerPluginCApi
      linux:
        pluginClass: FlutterUniversalBleServerPlugin
      web:
        pluginClass: UniversalBleServerWeb
        fileName: universal_ble_server_web.dart
