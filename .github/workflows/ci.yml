name: Validate library
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/integration_test tool
      - run: flutter analyze
      - run: dart run tool/protocol_smoke.dart
      - run: dart pub global activate dartdoc
      - run: dart pub global run dartdoc --sdk-dir "$FLUTTER_ROOT/bin/cache/dart-sdk" --output /tmp/ble-api
      - run: flutter pub publish --dry-run
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/browser_client_test.cjs
      - run: flutter test --coverage
      - run: flutter test --platform chrome test/web
      - run: flutter build web
        working-directory: example
  minimum-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub downgrade
      - run: flutter analyze
      - run: flutter test
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk --debug
          - os: macos-latest
            target: macos --debug
          - os: macos-latest
            target: ios --debug --no-codesign
          - os: windows-latest
            target: windows --debug
          - os: ubuntu-latest
            target: linux --debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux build dependencies
        if: matrix.target == 'linux --debug'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use CocoaPods for the standard Apple builds
        if: runner.os == 'macOS'
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }}
        working-directory: example

  apple-swiftpm:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['macos --debug', 'ios --debug --no-codesign']
    defaults:
      run:
        working-directory: universal_ble_server/example
    steps:
      - uses: actions/checkout@v4
        with:
          path: universal_ble_server
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Swift Package Manager in the example
        run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }}
