name: Publish to pub.dev
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions:
  contents: read
  id-token: write
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Verify release metadata
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version: //p' pubspec.yaml)"
          test -s LICENSE
          ! grep -q 'TODO\|not yet licensed' LICENSE
      - run: flutter pub publish --dry-run
      - run: flutter pub publish --force
